<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="368" viewBox="0 0 1100 368"><rect width="100%" height="100%" fill="white"/><rect x="20" y="20" width="1060" height="70" rx="16" fill="#F5F9FC" stroke="#BFD6E9" stroke-width="2"/><text x="550" y="49" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#1D3553">LEAD DECIDES WHETHER TO SPEAK</text><text x="550" y="74" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#68788B">Ask one question · Recap · Acknowledge · No public reply</text><line x1="550" y1="90" x2="550" y2="125" stroke="#3275B5" stroke-width="3" stroke-linecap="round"/><g transform="translate(550 133) rotate(90)"><path d="M-9 -8 L0 0 L-9 8" fill="none" stroke="#3275B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="30" y="156" width="320" height="139" rx="16" fill="#F5F6F8" stroke="#D7DCE3" stroke-width="2"/><text x="190" y="189" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#1D3553">OFF</text><text x="190" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#25354A">Humans converse</text><text x="190" y="261" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#68788B">No public AI replies</text><rect x="390" y="156" width="320" height="139" rx="16" fill="#EAF4FC" stroke="#BFD6E9" stroke-width="2"/><text x="550" y="189" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#1D3553">REVIEW  ·  DEFAULT</text><text x="550" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#25354A">AI writes a draft</text><text x="550" y="261" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#68788B">Consultant approves / edits / rejects</text><rect x="750" y="156" width="320" height="139" rx="16" fill="#ECF7F3" stroke="#B7DCCE" stroke-width="2"/><text x="910" y="189" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#1D3553">AUTOMATIC</text><text x="910" y="222" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#25354A">AI may reply selectively</text><text x="910" y="261" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#68788B">Output updates still reviewed</text><text x="550" y="337" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#68788B">Mode is per conversation · Only the consultant can change it · Mode changes are recorded</text></svg>