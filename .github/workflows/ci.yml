# Runs on every pull request into main and on every push to main.
# The job names below are what the "Protect main" ruleset requires (step 3b).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm --prefix src/web ci
      # The same client builds for the demo and for the real API (docs/engineering.md section 14).
      - run: npm --prefix src/web run build:demo
      - run: npm --prefix src/web run build:api
      # The build above is the api one: it must hold no demo code.
      - name: The api build holds no demo code
        run: bash tools/check-no-demo-code.sh src/web/dist/assets
      - run: npm --prefix src/web test

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh tools/check-doc-links.ps1

  api:
    name: API build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test src/api

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    # Only the push to main may publish; the token gets packages: write for this job only.
    permissions:
      contents: read
      packages: write
    env:
      PREFIX: ghcr.io/burakata/idea-discovery-app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          tags: ${{ env.PREFIX }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          load: true
          tags: ${{ env.PREFIX }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Start the images and check what they expose
        run: bash tools/check-docker-stack.sh
        env:
          IMAGE_TAG: ${{ github.sha }}
      # Pull requests never publish. The server runs a commit SHA, never latest.
      - name: Log in to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push both images, tagged with the commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$PREFIX/api:${{ github.sha }}"
          docker push "$PREFIX/web:${{ github.sha }}"
