# Runs on every pull request into main and on every push to main.
# The job names below are what the "Protect main" ruleset requires (step 3b).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm --prefix src/web ci
      # The same client builds for the demo and for the real API (docs/engineering.md section 14).
      - run: npm --prefix src/web run build:demo
      - run: npm --prefix src/web run build:api
      # The build above is the api one: it must hold no demo code.
      - name: The api build holds no demo code
        run: |
          failed=0
          for marker in "Reset demo" "Interactive preview" "Try the demo" "hand-written sample" "Home-cooked meals" "Ev yemekleri" "interviewer.md" "idea-discovery-rooms-demo"; do
            if grep -rqF -- "$marker" src/web/dist/assets; then
              echo "::error::The api build contains demo text: $marker"
              failed=1
            fi
          done
          exit $failed
      - run: npm --prefix src/web test

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh tools/check-doc-links.ps1

  api:
    name: API build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test src/api
